<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12372a" />
    <title>GymLog – Dein Trainingsprotokoll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="app-message" class="app-message" role="status" aria-live="polite"></div>

      <section class="card plans-card" id="plan-section" aria-labelledby="plans-title">
        <div id="training-day-tabs" class="training-day-tabs" role="tablist" aria-label="Trainingstage"></div>
        <div id="training-days" class="training-days"></div>
        <p id="empty-plan" class="empty-state">Lege deinen ersten Trainingstag über das Plus an.</p>
        <div class="day-exercise-adder">
          <label for="day-exercise-select">Übung zum Trainingstag hinzufügen</label>
          <div class="add-exercise-row">
            <select id="day-exercise-select"></select>
            <button class="button button-primary button-small" id="add-day-exercise-button" type="button">+ Übung hinzufügen</button>
            <button class="button button-quiet button-small" id="add-exercise-button" type="button">+ Neue Übung</button>
          </div>
        </div>
      </section>
      <div class="set-counter" aria-live="polite"><strong id="total-sets">0</strong> gespeicherte Sätze</div>

    </main>

    <dialog id="exercise-dialog" class="modal">
      <form id="exercise-form" method="dialog">
        <div class="modal-heading">
          <div>
            <p class="section-label">Bibliothek</p>
            <h2 id="dialog-title">Übung hinzufügen</h2>
          </div>
          <button class="close-button" id="close-dialog-button" type="button" aria-label="Dialog schließen">×</button>
        </div>
        <div class="field">
          <label for="exercise-name">Name der Übung</label>
          <input id="exercise-name" maxlength="60" required placeholder="z. B. Kniebeugen" />
          <p class="field-error" id="exercise-name-error"></p>
        </div>
        <div class="modal-actions">
          <button class="button button-quiet" id="cancel-dialog-button" type="button">Abbrechen</button>
          <button class="button button-primary" type="submit">Speichern</button>
        </div>
      </form>
    </dialog>

    <dialog id="day-dialog" class="modal">
      <form id="day-form" method="dialog">
        <div class="modal-heading">
          <div>
            <p class="section-label">Trainingsplan</p>
            <h2>Trainingstag hinzufügen</h2>
          </div>
          <button class="close-button" id="close-day-dialog-button" type="button" aria-label="Dialog schließen">×</button>
        </div>
        <div class="field">
          <label for="day-name">Name des Trainingstags</label>
          <input id="day-name" maxlength="50" required placeholder="z. B. Push oder Beine" />
          <p class="field-error" id="day-name-error"></p>
        </div>
        <div class="modal-actions">
          <button class="button button-quiet" id="cancel-day-dialog-button" type="button">Abbrechen</button>
          <button class="button button-primary" type="submit">Tag speichern</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
